[project]
name = "va-sim-server"
version = "0.1.0"
description = "VoiceAgents simulator runner: fake Telnyx, ElevenLabs, LLM, and Stripe servers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "starlette>=1.0",
    "va-common",
    "va-sim",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "va_sim_server"

[tool.uv.sources]
va-common = { workspace = true }
va-sim = { workspace = true }
