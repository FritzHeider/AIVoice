[project]
name = "va-telephony-edge"
version = "0.1.0"
description = "VoiceAgents telephony edge: Telnyx webhook ingress (FastAPI), probes, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "va-common",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "va_edge"

[tool.uv.sources]
va-common = { workspace = true }
