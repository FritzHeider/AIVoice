[project]
name = "va-telephony-edge"
version = "0.1.0"
description = "VoiceAgents telephony edge: Telnyx webhook ingress (FastAPI), event processing, probes, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "opentelemetry-api>=1.45.1",
    "orjson>=3.13.0",
    "pynacl>=1.5",
    "va-billing",
    "va-common",
    "va-compliance",
    "va-db",
    "va-domain",
    "va-events",
    "redis>=5.2",
    "temporalio>=1.9",
    "va-telnyx",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "va_edge"

[tool.uv.sources]
va-billing = { workspace = true }
va-common = { workspace = true }
va-compliance = { workspace = true }
va-db = { workspace = true }
va-domain = { workspace = true }
va-events = { workspace = true }
va-telnyx = { workspace = true }
