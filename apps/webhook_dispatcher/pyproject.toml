[project]
name = "va-webhook-dispatcher"
version = "0.1.0"
description = "VoiceAgents webhook dispatcher: outbox delivery with signing, retries, SSRF protection, probes, metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "orjson>=3.13.0",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "starlette>=1.0",
    "va-common",
    "va-db",
    "va-domain",
    "va-events",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "va_webhooks"

[tool.uv.sources]
va-common = { workspace = true }
va-db = { workspace = true }
va-domain = { workspace = true }
va-events = { workspace = true }
