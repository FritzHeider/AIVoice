# Local development stack (specs/29 §2). Profiles: infra (dependencies), apps, e2e, observability.
# `make up` starts the infra profile; `make up PROFILE=infra,observability` adds Jaeger, Prometheus, and Grafana.
# The Python images (sim and the application services) are built from infra/docker/python.Dockerfile;
# `docker-compose.e2e.yml` holds the e2e-only sim settings. `scripts/dev_up.sh` runs `migrate` before the apps.
name: voiceagents

# Application services reach their dependencies by service name (specs/29 §2 and its P05-T17a Decision).
# `.env.compose` is `.env` rendered by scripts/compose_env.py (Compose reads `KEY=  # comment` as the comment text);
# dev_up.sh writes it before starting the apps, and it is optional so `docker compose config` works on a checkout.
# TELNYX_PUBLIC_KEY is blanked: `.env` holds the key of the previous sim start, so edge and media read the current
# one from the shared `simkeys` volume (`.sim/telnyx_public_key`, the local fallback).
x-py-env: &py-env
  env_file:
    - path: .env.compose
      required: false
  environment: &py-env-vars
    # jscpd:ignore-start  (mirrors the specs/29 §2 block; scripts/tests/test_compose.py compares them)
    DATABASE_URL: postgresql+asyncpg://va:va@postgres:5432/va
    REDIS_URL: redis://redis:6379/0
    CLICKHOUSE_URL: http://default:@clickhouse:8123/va
    TEMPORAL_HOST: temporal:7233
    S3_ENDPOINT_URL: http://minio:9000
    TELNYX_API_BASE: http://sim:9100/v2
    ELEVENLABS_API_BASE: http://sim:9200
    ELEVENLABS_WS_BASE: ws://sim:9200
    LLM_DEFAULT_BASE_URL: http://sim:9300/v1
    STRIPE_API_BASE: http://sim:9400
    SMTP_URL: smtp://mailpit:1025
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    EDGE_PUBLIC_HOST: edge:8100
    MEDIA_PUBLIC_HOST: media:8200
    TELNYX_PUBLIC_KEY: ""
    # jscpd:ignore-end

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: va
      POSTGRES_PASSWORD: va
      POSTGRES_DB: va
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: va
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9009:9000"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: va
      POSTGRES_PWD: va
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: default
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: [infra, apps]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024.10.13
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8
    profiles: [infra, apps, e2e]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minio minio12345 && mc mb -p local/va-recordings local/va-kb local/va-voice-samples

  mailpit:
    image: axllent/mailpit:v1.20
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  sim:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: sim
        MODULE: va_sim_server.main
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      SIM_CLOCK: realtime
      SIM_EDGE_WEBHOOK_URL: http://edge:8100/telnyx/voice
      SIM_MESSAGING_WEBHOOK_URL: http://edge:8100/telnyx/messaging
      SIM_STRIPE_WEBHOOK_URL: http://api:8000/v1/billing/stripe/webhook
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["9100:9100", "9200:9200", "9300:9300", "9400:9400"]
    volumes:
      - simkeys:/app/.sim
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9100/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: api
        MODULE: va_db.migrate
    profiles: [apps, e2e]
    <<: *py-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: api
        MODULE: va_api.serve
    profiles: [apps, e2e]
    <<: *py-env
    restart: unless-stopped
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  edge:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: telephony_edge
        MODULE: va_edge.serve
    profiles: [apps, e2e]
    <<: *py-env
    restart: unless-stopped
    ports: ["8100:8100"]
    volumes:
      - simkeys:/app/.sim:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  media:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: media_worker
        MODULE: va_media.main
    profiles: [apps, e2e]
    <<: *py-env
    restart: unless-stopped
    ports: ["8200:8200"]
    stop_grace_period: 60s
    volumes:
      - simkeys:/app/.sim:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8200/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: worker
        MODULE: va_worker.main
    profiles: [apps, e2e]
    <<: *py-env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9300/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  webhooks:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: webhook_dispatcher
        MODULE: va_webhooks.main
    profiles: [apps, e2e]
    <<: *py-env
    environment:
      <<: *py-env-vars
      WEBHOOK_ALLOW_PRIVATE: "true"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9400/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  events-sink:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        SERVICE: events_sink
        MODULE: va_events_sink.main
    profiles: [apps, e2e]
    <<: *py-env
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9500/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: [infra, apps, e2e, observability]
    restart: unless-stopped
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889", "13133:13133"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    restart: unless-stopped
    ports: ["16686:16686"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata: {}
  redisdata: {}
  chdata: {}
  miniodata: {}
  prometheusdata: {}
  grafanadata: {}
  simkeys: {}
