# Local development stack (specs/29 §2). Profiles: infra (dependencies), apps, e2e, observability.
# `make up` starts the infra profile; `make up PROFILE=infra,observability` adds Jaeger, Prometheus, and Grafana.
name: voiceagents

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      POSTGRES_USER: va
      POSTGRES_PASSWORD: va
      POSTGRES_DB: va
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: va
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9009:9000"]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: va
      POSTGRES_PWD: va
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: default
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: [infra, apps]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024.10.13
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8
    profiles: [infra, apps, e2e]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 minio minio12345 && mc mb -p local/va-recordings local/va-kb local/va-voice-samples

  mailpit:
    image: axllent/mailpit:v1.20
    profiles: [infra, apps, e2e]
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    profiles: [infra, apps, e2e, observability]
    restart: unless-stopped
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889", "13133:13133"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    restart: unless-stopped
    ports: ["16686:16686"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata: {}
  redisdata: {}
  chdata: {}
  miniodata: {}
  prometheusdata: {}
  grafanadata: {}
