[project]
name = "va-common"
version = "0.1.0"
description = "Shared VoiceAgents primitives: settings, clock, ids, JSON, errors, money"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "uuid-utils>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
