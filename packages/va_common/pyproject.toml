[project]
name = "va-common"
version = "0.1.0"
description = "Shared VoiceAgents primitives: settings, clock, ids, JSON, errors, money, logging, masking, crypto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "cryptography>=50.0.2",
    "opentelemetry-api>=1.45.1",
    "orjson>=3.13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
