# Alembic configuration for the va_db schema (specs/03-data-model.md).
# The database URL is not stored here: migrations/env.py reads DATABASE_URL (specs/02 §6) on every run.
# Usage: make migrate, or uv run alembic -c packages/va_db/alembic.ini <command> (upgrade head --sql prints SQL).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
