[project]
name = "va-domain"
version = "0.1.0"
description = "VoiceAgents shared Pydantic domain schemas and enums (org settings, voice settings, calling windows)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "email-validator>=2.3.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
