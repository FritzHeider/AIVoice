[project]
name = "va-elevenlabs"
version = "0.1.0"
description = "VoiceAgents ElevenLabs client: multi-context TTS and realtime STT WebSockets, and the REST client (TTS, voices, batch STT), with retries, metrics, and tracing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=17.0",
    "httpx>=0.28",
    "anyio>=4",
    "orjson>=3.13.0",
    "pydantic>=2.9",
    "opentelemetry-api>=1.45.1",
    "prometheus-client>=0.26.0",
    "va-common",
    "va-domain",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
va-common = { workspace = true }
va-domain = { workspace = true }
