[project]
name = "va-events"
version = "0.1.0"
description = "VoiceAgents analytics events: ClickHouse schema migrations and their async applier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect[async]>=1.11",
    "va-common",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
va-common = { workspace = true }
