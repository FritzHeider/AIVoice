[project]
name = "va-events"
version = "0.1.0"
description = "VoiceAgents events: domain event bus (publisher, call-event buffer, stream consumers) and ClickHouse schema, webhook outbox routing and delivery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect[async]>=1.11",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "orjson>=3.13.0",
    "pydantic>=2.9",
    "redis>=5.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "va-common",
    "va-db",
    "va-domain",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
va-common = { workspace = true }
va-db = { workspace = true }
va-domain = { workspace = true }
