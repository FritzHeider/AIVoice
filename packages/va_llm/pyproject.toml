[project]
name = "va-llm"
version = "0.1.0"
description = "VoiceAgents LLM gateway: OpenAI-compatible providers (platform and per-org), call policies with retries, fallback and circuit breakers, usage metering, metrics, and tracing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "orjson>=3.13.0",
    "redis>=5.1",
    "jsonschema>=4.26",
    "tiktoken>=0.12",
    "opentelemetry-api>=1.45.1",
    "prometheus-client>=0.26.0",
    "va-common",
    "va-db",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
va-common = { workspace = true }
va-db = { workspace = true }
