[project]
name = "va-voice"
version = "0.1.0"
description = "VoiceAgents real-time audio pipeline primitives"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3",
    "onnxruntime>=1.31.1",
    "soxr>=1.1.0",
    "va-common",
]

[tool.uv.sources]
va-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
