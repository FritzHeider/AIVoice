[project]
name = "va-workflows"
version = "0.1.0"
description = "VoiceAgents Temporal workflows and activities: call lifecycle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.45.1",
    "pydantic>=2.9",
    "redis>=5.1",
    "temporalio>=1.34",
    "va-common",
    "va-db",
    "va-domain",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
va-common = { workspace = true }
va-db = { workspace = true }
va-domain = { workspace = true }
