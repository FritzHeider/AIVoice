[project]
name = "voiceagents-workspace"
version = "0.0.0"
description = "VoiceAgents uv workspace root (dev tooling only)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "respx>=0.23",
  "hypothesis>=6.170",
  "freezegun>=1.5",
  "testcontainers[postgres,redis,clickhouse,minio]>=4.15",
  "mypy>=2.4",
  "ruff>=0.17",
  "types-python-dateutil>=2.9.0.20261021",
  "asgi-lifespan>=2.1",
  "syrupy>=6.1",
  "va-common",
  "types-aioboto3[kms,s3]>=15.5.0",
  "fakeredis[lua]>=2.40.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20260906",
  "numpy>=2.3",
  "va-api",
  "openapi-spec-validator>=0.9.0",
  "va-telephony-edge",
  "va-media-worker",
  "va-worker",
  "va-webhook-dispatcher",
  "va-events-sink",
  "va-sim",
  "va-sim-server",
  "va-db",
  "va-events",
  "va-domain",
  "va-telnyx",
  "va-elevenlabs",
  "va-llm",
  "va-voice",
  "va-compliance",
  "va-billing",
  "va-workflows",
  "va-engine",
  "va-tools",
  "actionlint-py>=1.7.12.25",
  "pre-commit>=4.7.0",
  "aiosmtpd>=1.4.6",
  "pynacl>=1.5",
  "openai>=2",
  "jsonschema>=4.26",
  "types-jsonschema>=4.26.0.20261006",
  "stripe>=16.1,<17",
]

[tool.uv]
package = false

[tool.uv.sources]
va-common = { workspace = true }
va-api = { workspace = true }
va-telephony-edge = { workspace = true }
va-media-worker = { workspace = true }
va-worker = { workspace = true }
va-webhook-dispatcher = { workspace = true }
va-events-sink = { workspace = true }
va-sim = { workspace = true }
va-sim-server = { workspace = true }
va-db = { workspace = true }
va-events = { workspace = true }
va-domain = { workspace = true }
va-telnyx = { workspace = true }
va-elevenlabs = { workspace = true }
va-llm = { workspace = true }
va-voice = { workspace = true }
va-compliance = { workspace = true }
va-workflows = { workspace = true }
va-billing = { workspace = true }
va-engine = { workspace = true }
va-tools = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*", "sdks/python", "sdks/cli"]
exclude = ["apps/dashboard", "apps/widget", "apps/docs"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["scripts", "packages/*/src", "apps/*/src", "sdks/python/src", "sdks/cli/src"]
# Markdown is excluded so `ruff format` never rewrites code samples in specs/, prompts/, plan/.
extend-exclude = ["node_modules", ".venv", "dist", "build", ".next", "*.md"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL",
  "TRY", "RUF", "ASYNC", "S",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ARG001"]
"tests_live/**" = ["S101", "PLR2004", "ARG001"]
"tests_e2e/**" = ["S101", "PLR2004", "ARG001"]
"scripts/**" = ["T20", "S603", "S607"]
"apps/*/src/*/api/**" = ["PLR0913"]
"apps/*/src/*/routers/**" = ["PLR0913"]
# Alembic scripts are not a package; revision files start with the revision number; 0001 keeps spec comments verbatim.
"packages/va_db/src/va_db/migrations/**" = ["INP001", "N999"]
"packages/va_db/src/va_db/migrations/versions/0001_initial.py" = ["INP001", "N999", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "scripts:packages/va_common/src:packages/va_common/tests:apps/api/src:apps/api/tests/support:apps/media_worker/tests/support:apps/worker/tests/support:apps/telephony_edge/src:apps/telephony_edge/tests/support:apps/media_worker/src:apps/worker/src:apps/webhook_dispatcher/src:apps/webhook_dispatcher/tests/support:apps/events_sink/src:apps/events_sink/tests/support:apps/sim/src:packages/va_sim/src:packages/va_sim/tests/support:packages/va_db/src:packages/va_events/src:packages/va_domain/src:packages/va_domain/tests/support:packages/va_events/tests/support:packages/va_db/tests/support:packages/va_telnyx/src:packages/va_telnyx/tests/support:packages/va_elevenlabs/src:packages/va_elevenlabs/tests/support:packages/va_llm/src:packages/va_llm/tests/support:packages/va_voice/src:packages/va_voice/tests/support:packages/va_compliance/src:packages/va_compliance/tests/support:packages/va_billing/src:packages/va_billing/tests/support:packages/va_workflows/src:packages/va_workflows/tests/support:packages/va_engine/src:packages/va_engine/tests/support:packages/va_tools/src:packages/va_tools/tests/support:tests_live/support:tests_e2e/support"
files = [
  "scripts",
  "packages/va_common/src",
  "packages/va_common/tests",
  "packages/va_db/src",
  "packages/va_db/tests",
  "packages/va_events/src",
  "packages/va_events/tests",
  "packages/va_domain/src",
  "packages/va_domain/tests",
  "apps/api/src",
  "apps/api/tests",
  "apps/telephony_edge/src",
  "apps/telephony_edge/tests",
  "apps/media_worker/src",
  "apps/media_worker/tests",
  "apps/worker/src",
  "apps/worker/tests",
  "apps/webhook_dispatcher/src",
  "apps/webhook_dispatcher/tests",
  "apps/events_sink/src",
  "apps/events_sink/tests",
  "apps/sim/src",
  "apps/sim/tests",
  "packages/va_sim/src",
  "packages/va_sim/tests",
  "packages/va_telnyx/src",
  "packages/va_telnyx/tests",
  "packages/va_elevenlabs/src",
  "packages/va_elevenlabs/tests",
  "packages/va_llm/src",
  "packages/va_llm/tests",
  "packages/va_voice/src",
  "packages/va_voice/tests",
  "packages/va_compliance/src",
  "packages/va_compliance/tests",
  "packages/va_billing/src",
  "packages/va_billing/tests",
  "packages/va_workflows/src",
  "packages/va_workflows/tests",
  "packages/va_engine/src",
  "packages/va_engine/tests",
  "packages/va_tools/src",
  "packages/va_tools/tests",
  "tests_live",
  "tests_e2e",
]
exclude = ['(^|/)node_modules/', '(^|/)\.venv/', '(^|/)scripts/ralph/']

# authlib ships no type information (no py.typed); va_api.auth.oidc_client wraps the few calls it makes.
[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

# tiktoken_ext (the encoding registry installed with tiktoken) has no py.typed; only va_llm's drift test reads it.
[[tool.mypy.overrides]]
module = ["tiktoken_ext", "tiktoken_ext.*"]
ignore_missing_imports = true

# soxr ships no type information (no py.typed); va_voice.audio.resample wraps the two calls it makes.
[[tool.mypy.overrides]]
module = ["soxr", "soxr.*"]
ignore_missing_imports = true

# onnxruntime ships no type information (no py.typed); only va_voice.vad_model calls it, behind typed methods.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
testpaths = ["scripts/tests", "packages", "apps", "sdks", "tests_live", "tests_e2e/unit"]
pythonpath = [
  "scripts",
  "packages/va_common/tests",
  "packages/va_db/tests/support",
  "packages/va_events/tests/support",
  "packages/va_domain/tests/support",
  "apps/api/tests/support",
  "apps/media_worker/tests/support",
  "apps/worker/tests/support",
  "apps/events_sink/tests/support",
  "apps/telephony_edge/tests/support",
  "apps/webhook_dispatcher/tests/support",
  "packages/va_sim/tests/support",
  "packages/va_telnyx/tests/support",
  "packages/va_elevenlabs/tests/support",
  "packages/va_llm/tests/support",
  "packages/va_voice/tests/support",
  "packages/va_compliance/tests/support",
  "packages/va_billing/tests/support",
  "packages/va_workflows/tests/support",
  "packages/va_engine/tests/support",
  "packages/va_tools/tests/support",
  "tests_live/support",
  "tests_e2e/support",
]
timeout = 60
markers = [
  "integration: needs docker/testcontainers",
  "e2e: simulator end-to-end",
  "live: real vendors, LIVE_TESTS=1",
  "bench: performance benchmarks, run with -m bench",
  "capacity: single-pod concurrency check, run with make e2e-capacity",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio layer switches greenlets; without this, lines after an awaited DB call read as missed.
concurrency = ["greenlet", "thread"]
source = ["scripts", "packages", "apps", "sdks"]
omit = ["*/tests/*", "scripts/ralph/*", "*/node_modules/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
